<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Get in touch</title>

    <!-- Spectral Extra Light -->
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@200&display=swap" rel="stylesheet" />

    <style>
      html, body, * {
        font-family: "Spectral", serif;
        font-weight: 200;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .wrapper {
        padding: 16px;
      }

      h3 {
        margin-top: 0;
        font-size: 20px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        font-size: 14px;
      }

      input,
      textarea {
        width: 100%;
        padding: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #eee;       /* same as button */
        border: 1px solid #ccc;
      }

      button {
        padding: 10px 14px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        background: #eee;
        width: fit-content;     /* only as wide as the text */
      }

      .status {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 4px;
        min-height: 1em;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <h3>Get in touch</h3>

      <form id="contactForm">
        <label>
          Name
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Message
          <textarea name="message" rows="5" required></textarea>
        </label>

        <button type="submit" id="submitBtn">Send</button>
        <div id="status" class="status"></div>
      </form>
    </div>

    <script>
      // >>> PUT YOUR APPS SCRIPT WEB APP URL HERE <<<
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygtqv27UsIwK6tThlMDMIwuDSSCL8MJRMrNvr2NidZVrHt6jO4XMh345GEatht9d3s/exec";

      const form = document.getElementById("contactForm");
      const submitBtn = document.getElementById("submitBtn");
      const statusEl = document.getElementById("status");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        statusEl.textContent = "Sending…";
        submitBtn.disabled = true;

        const formData = new FormData(form);

        try {
          // Use no-cors so the browser doesn't whine about CORS;
          // we don't need the response body, just fire-and-forget.
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
          });

          statusEl.textContent = "Sent.";
          form.reset();
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Something went wrong. Please try again.";
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
